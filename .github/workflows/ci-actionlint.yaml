name: Lint GitHub Actions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Dependabot does not move a `docker://` image; a new actionlint is bumped here by hand.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -ignore SC2129 -ignore SC2086
