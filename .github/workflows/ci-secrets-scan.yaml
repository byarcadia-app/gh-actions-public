name: Secrets scan

# Runs this repository's two scan workflows on its own pull requests and pushes to `main`, so a
# change to either, an action bump inside the TruffleHog container included, runs here before
# every caller picks it up at `@main`.
on:
  pull_request:
    branches: [main, ci/prove-checkout-7-in-trufflehog]
  push:
    branches: [main, ci/prove-checkout-7-in-trufflehog]

permissions:
  contents: read

jobs:
  on-pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/secrets-scan-on-pr.yaml

  on-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/secrets-scan-on-push.yaml
