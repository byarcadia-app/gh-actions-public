version: 2
updates:
  # Bumps the SHA-pinned actions in .github/workflows/, the ones the reusable workflows run in
  # every caller's job included. A week's cooldown keeps a fresh release out until it has settled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      time: "08:00"
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
